<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('个人信息 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1>个人信息</h1>
            <p class="header-desc">修改显示名与登录密码</p>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div class="form-page-card">
                <form th:action="@{/profile/save}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">账户名</label>
                            <input type="text" class="form-control" th:value="${user.username}" readonly disabled>
                            <div class="form-text">账户名不可修改</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">显示名 <span class="text-danger">*</span></label>
                            <input type="text" name="displayName" class="form-control" th:value="${user.displayName}" required>
                            <div class="form-text">侧栏及工单中展示的名称</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">注册时间</label>
                            <input type="text" class="form-control" readonly disabled
                                   th:value="${#temporals.format(user.createTime, 'yyyy-MM-dd HH:mm')}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">账号状态</label>
                            <input type="text" class="form-control" readonly disabled
                                   th:value="${user.enabled ? '已启用' : '待审核'}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">新密码</label>
                            <input type="password" name="newPassword" class="form-control" placeholder="留空则不修改">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">确认新密码</label>
                            <input type="password" name="confirmPassword" class="form-control" placeholder="修改密码时必填">
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="/dashboard" class="btn btn-outline-secondary">返回工作台</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
