<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('权限授权 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1>权限授权</h1>
            <p class="header-desc"
               th:text="'为账号「' + ${user.displayName} + '（' + ${user.username} + '）」分配菜单与医院权限'">授权</p>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div class="form-page-card">
                <form th:action="@{/users/{id}/permissions(id=${user.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-4">
                        <h2 class="h6 mb-3">授权菜单</h2>
                        <p class="text-secondary small mb-3">未勾选的菜单不会出现在侧栏，也无法直接访问对应页面。</p>
                        <div class="row g-2">
                            <div class="col-md-4" th:each="m : ${allMenus}">
                                <div class="form-check border rounded px-3 py-2">
                                    <input class="form-check-input" type="checkbox" name="menus"
                                           th:id="'menu_' + ${m.code}" th:value="${m.code}"
                                           th:checked="${selectedMenus.contains(m.code)}">
                                    <label class="form-check-label" th:for="'menu_' + ${m.code}" th:text="${m.label}">菜单</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h2 class="h6 mb-3">授权产品交付</h2>
                        <p class="text-secondary small mb-3">
                            控制该账号在交付、工单、工作台中能看到哪些医院×产品×模块。
                            拥有「账号管理」菜单的用户默认可看全部交付。
                        </p>
                        <div th:if="${#lists.isEmpty(deliveries)}" class="text-secondary small">暂无产品交付，请先创建。</div>
                        <div class="row g-2" th:unless="${#lists.isEmpty(deliveries)}">
                            <div class="col-md-6" th:each="a : ${deliveries}">
                                <div class="form-check border rounded px-3 py-2">
                                    <input class="form-check-input" type="checkbox" name="deliveries"
                                           th:id="'delivery_' + ${a.id}" th:value="${a.id}"
                                           th:checked="${selectedDeliveries.contains(a.id)}">
                                    <label class="form-check-label" th:for="'delivery_' + ${a.id}" th:text="${a.displayName}">交付</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">保存权限</button>
                        <a href="/users" class="btn btn-outline-secondary">返回列表</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
