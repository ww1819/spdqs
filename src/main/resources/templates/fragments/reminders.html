<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="reminderPanel">
    <div th:unless="${#lists.isEmpty(reminders)}" class="mb-3">
        <div th:each="rem : ${reminders}"
             class="alert alert-tech d-flex justify-content-between align-items-start gap-3">
            <div>
                <strong>工单提醒</strong>
                <span th:text="${rem.message}"></span>
                <span class="text-muted small ms-2" th:text="'（' + ${rem.remindHour} + ':00）'"></span>
            </div>
            <form th:action="@{/reminders/{id}/read(id=${rem.id})}" method="post" class="m-0 flex-shrink-0">
                <input type="hidden" name="returnUrl" th:value="${returnUrl}">
                <button type="submit" class="btn btn-sm btn-outline-primary">知道了</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
