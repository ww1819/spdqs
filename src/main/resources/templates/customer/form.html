<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('使用单位 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1 th:text="${customer.id != null ? '编辑使用单位' : '新建使用单位'}">使用单位</h1>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div class="form-page-card">
                <form th:action="@{/customers/save}" method="post" th:object="${customer}">
                    <input type="hidden" th:field="*{id}" th:if="${customer.id != null and !customer.id.isEmpty()}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">名称 <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">编码</label>
                            <input type="text" th:field="*{code}" class="form-control" placeholder="可选院内编码">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">组织类型</label>
                            <select th:field="*{orgType}" class="form-select">
                                <option value="医院">医院</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">状态</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="启用">启用</option>
                                <option value="停用">停用</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">联系方式</label>
                            <textarea th:field="*{contact}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">备注</label>
                            <textarea th:field="*{remark}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-12" th:if="${deliveryCount != null}">
                            <p class="text-secondary small mb-0"
                               th:text="'当前关联产品交付 ' + ${deliveryCount} + ' 条'">关联</p>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="/customers" class="btn btn-outline-secondary">返回列表</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
