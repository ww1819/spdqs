<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('项目分析 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1>项目分析</h1>
            <p class="header-desc">汇总项目流程与功能说明，便于团队同步</p>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>

            <div class="panel">
                <div class="toolbar">
                    <span class="text-secondary small">共 <span th:text="${#lists.size(projects)}">0</span> 个项目</span>
                    <a href="/analysis/new" class="btn btn-primary btn-sm">+ 新建项目</a>
                </div>
                <div class="panel-body">
                    <div th:if="${#lists.isEmpty(projects)}" class="table-empty">
                        <p class="mb-2">暂无分析项目</p>
                        <a href="/analysis/new" class="btn btn-outline-primary btn-sm">创建第一个项目</a>
                    </div>
                    <table class="data-table" th:unless="${#lists.isEmpty(projects)}">
                        <thead>
                        <tr>
                            <th>项目名称</th>
                            <th>简介</th>
                            <th>创建人</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${projects}">
                            <td>
                                <a th:href="@{/analysis/{id}(id=${item.id})}" class="link-tech fw-semibold"
                                   th:text="${item.name}">项目</a>
                            </td>
                            <td class="cell-clamp" th:text="${item.description ?: '—'}">—</td>
                            <td th:text="${item.createBy ?: '—'}">—</td>
                            <td th:text="${item.createTime != null ? #temporals.format(item.createTime, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                            <td>
                                <div class="table-actions">
                                    <a th:href="@{/analysis/{id}(id=${item.id})}" class="btn btn-outline-primary btn-sm">进入</a>
                                    <a th:href="@{/analysis/{id}/export(id=${item.id})}" class="btn btn-outline-secondary btn-sm">导出</a>
                                    <a th:href="@{/analysis/{id}/export-excel(id=${item.id})}" class="btn btn-outline-success btn-sm" title="按合并层级样式导出 Excel">导出Excel</a>
                                    <form th:action="@{/analysis/{id}/delete(id=${item.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('确定删除该项目及全部流程？');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">删除</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
