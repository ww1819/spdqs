<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('新建项目分析 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1>新建项目分析</h1>
            <p class="header-desc">创建项目后进入流程树画布</p>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div class="form-page-card">
                <form action="/analysis/new" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">项目名称 <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required placeholder="如：XX医院计费系统">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">根流程标题</label>
                            <input type="text" name="rootTitle" class="form-control" th:value="${rootTitle}" placeholder="默认：登录">
                        </div>
                        <div class="col-12">
                            <label class="form-label">项目简介</label>
                            <textarea name="description" class="form-control" rows="4" placeholder="可选，简要说明项目背景"></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">创建并进入</button>
                        <a href="/analysis" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
