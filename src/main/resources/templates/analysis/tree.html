<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head(${project.name + ' - 项目分析'})}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <div class="d-flex flex-wrap align-items-start justify-content-between gap-3">
                <div>
                    <h1 th:text="${project.name}">项目分析</h1>
                    <p class="header-desc mb-0" th:text="${project.description ?: '流程树画布 — 悬停卡片可操作'}">流程树画布</p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="btn btn-outline-primary btn-sm" id="btnCopyFlow">复制流程</button>
                    <a th:href="@{/analysis/{id}/export(id=${project.id})}" class="btn btn-outline-secondary btn-sm">导出</a>
                    <a href="/analysis" class="btn btn-outline-secondary btn-sm">返回列表</a>
                </div>
            </div>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div id="flowToast" class="flow-toast" role="status"></div>

            <div class="panel flow-panel">
                <div class="panel-body p-0">
                    <div class="flow-canvas-wrap" th:data-project-id="${project.id}" id="flowCanvasWrap">
                        <svg class="flow-lines" id="flowLines" aria-hidden="true"></svg>
                        <div class="flow-canvas" id="flowCanvas">
                            <div class="flow-loading" id="flowLoading">加载中…</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 新建流程 -->
<div class="modal fade" id="newFlowModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新建流程</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label">流程标题</label>
                <input type="text" class="form-control" id="newFlowTitle" placeholder="如：验证账号">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="btnConfirmNewFlow">创建</button>
            </div>
        </div>
    </div>
</div>

<!-- 功能说明 -->
<div class="modal fade" id="descModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="descModalTitle">功能说明</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="descView" class="desc-view d-none"></div>
                <textarea id="descEdit" class="form-control" rows="10" placeholder="描述该流程的功能、触发条件、步骤与结果…"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-outline-primary d-none" id="btnDescEdit">编辑</button>
                <button type="button" class="btn btn-primary" id="btnDescSave">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 复制 fallback -->
<div class="modal fade" id="copyFallbackModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">复制流程文本</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-secondary small">无法自动复制，请手动全选复制以下内容：</p>
                <textarea class="form-control font-monospace" id="copyFallbackText" rows="16" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/analysis-tree.js}"></script>
</body>
</html>
