<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('产品维护 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1>产品</h1>
            <p class="header-desc">产品主数据，交付时按产品分类；停用后新建交付不可再选</p>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div class="panel">
                <div class="toolbar">
                    <form method="get" action="/products" class="toolbar-filters m-0">
                        <input type="text" name="keyword" class="form-control form-control-sm" style="width: 220px;"
                               placeholder="搜索名称/编码/拼音" th:value="${keyword}">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">筛选</button>
                        <a href="/products" class="btn btn-link btn-sm">重置</a>
                    </form>
                    <a href="/products/new" class="btn btn-primary btn-sm">+ 新建产品</a>
                </div>
                <div class="panel-body">
                    <div th:if="${#lists.isEmpty(products)}" class="table-empty">
                        <p class="mb-2">暂无产品</p>
                        <a href="/products/new" class="btn btn-outline-primary btn-sm">创建第一条</a>
                    </div>
                    <table class="data-table" th:unless="${#lists.isEmpty(products)}">
                        <thead>
                        <tr>
                            <th>名称</th>
                            <th>编码</th>
                            <th>拼音简码</th>
                            <th>序号</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${products}">
                            <td>
                                <a th:href="@{/products/{id}/edit(id=${p.id})}" class="link-tech fw-semibold"
                                   th:text="${p.name}">名称</a>
                            </td>
                            <td th:text="${p.code ?: '—'}">—</td>
                            <td th:text="${p.namePy ?: '—'}">—</td>
                            <td th:text="${p.sortOrder}">0</td>
                            <td th:text="${p.enabled} ? '启用' : '停用'">启用</td>
                            <td class="cell-actions">
                                <a th:href="@{/products/{id}/edit(id=${p.id})}">编辑</a>
                                <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('确定删除该产品？')">
                                    <button type="submit" class="btn btn-link btn-sm text-danger p-0 border-0">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
