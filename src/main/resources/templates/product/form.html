<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('产品维护 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1 th:text="${product.id != null ? '编辑产品' : '新建产品'}">产品</h1>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div class="form-page-card">
                <form th:action="@{/products/save}" method="post" th:object="${product}">
                    <input type="hidden" th:field="*{id}" th:if="${product.id != null and !product.id.isEmpty()}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">名称 <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" required
                                   placeholder="如：设备系统、耗材SPD">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">编码</label>
                            <input type="text" th:field="*{code}" class="form-control"
                                   placeholder="可空，保存时按名称生成拼音简码">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">序号</label>
                            <input type="number" th:field="*{sortOrder}" class="form-control" min="0">
                            <div class="form-text">越小越靠前；新建可空，自动排到末尾</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">状态</label>
                            <select th:field="*{enabled}" class="form-select">
                                <option th:value="true">启用</option>
                                <option th:value="false">停用</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">备注</label>
                            <textarea th:field="*{remark}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="col-12" th:if="${deliveryCount != null}">
                            <p class="text-secondary small mb-0"
                               th:text="'当前关联产品交付 ' + ${deliveryCount} + ' 条'">关联</p>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="/products" class="btn btn-outline-secondary">返回列表</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
