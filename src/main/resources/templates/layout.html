<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - 档案工单系统' : '档案工单系统'}">档案工单系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" sec:authorize="isAuthenticated()">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/archives">档案工单系统</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light small" th:text="'欢迎，' + ${currentUser}">欢迎</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">退出</button>
            </form>
        </div>
    </div>
</nav>

<div th:if="${activeTab != null}" class="bg-white border-bottom">
    <div class="container-fluid px-4">
        <ul class="nav nav-tabs border-0">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'archives'} ? 'active'" href="/archives">档案管理</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'tickets'} ? 'active'" href="/tickets">工单管理</a>
            </li>
        </ul>
    </div>
</div>

<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
