<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('工单管理 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1>工单列表</h1>
            <p class="header-desc">提交与跟踪项目工单</p>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>

            <div class="panel">
                <div class="toolbar">
                    <form method="get" action="/tickets" class="toolbar-filters m-0 flex-wrap" id="ticketFilterForm">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle status-filter-btn"
                                    type="button" id="statusFilterBtn" data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside" aria-expanded="false">
                                <span id="statusFilterLabel">全部状态</span>
                            </button>
                            <div class="dropdown-menu status-filter-menu p-2" aria-labelledby="statusFilterBtn">
                                <label class="status-filter-item">
                                    <input type="checkbox" class="form-check-input status-option" value="进行中"
                                           th:checked="${statusFilters != null and #lists.contains(statusFilters, '进行中')}">
                                    <span>进行中</span>
                                </label>
                                <label class="status-filter-item" th:each="s : ${ticketStatuses}">
                                    <input type="checkbox" class="form-check-input status-option" th:value="${s.label}"
                                           th:checked="${statusFilters != null and #lists.contains(statusFilters, s.label)}">
                                    <span th:text="${s.label}">状态</span>
                                </label>
                            </div>
                        </div>
                        <div id="statusHiddenInputs"></div>

                        <div class="dropdown">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle status-filter-btn"
                                    type="button" id="archiveFilterBtn" data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside" aria-expanded="false" style="min-width: 130px;">
                                <span id="archiveFilterLabel">全部项目</span>
                            </button>
                            <div class="dropdown-menu status-filter-menu p-2" aria-labelledby="archiveFilterBtn">
                                <label class="status-filter-item" th:each="opt : ${archiveOptions}">
                                    <input type="checkbox" class="form-check-input archive-option" th:value="${opt.id}"
                                           th:checked="${archiveIdFilters != null and #lists.contains(archiveIdFilters, opt.id)}">
                                    <span th:text="${opt.projectName}">项目</span>
                                </label>
                            </div>
                        </div>
                        <div id="archiveHiddenInputs"></div>

                        <div class="dropdown">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle status-filter-btn"
                                    type="button" id="systemFilterBtn" data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside" aria-expanded="false" style="min-width: 130px;">
                                <span id="systemFilterLabel">全部系统</span>
                            </button>
                            <div class="dropdown-menu status-filter-menu p-2" aria-labelledby="systemFilterBtn">
                                <label class="status-filter-item" th:each="sys : ${systemOptions}">
                                    <input type="checkbox" class="form-check-input system-option" th:value="${sys.id}"
                                           th:checked="${systemIdFilters != null and #lists.contains(systemIdFilters, sys.id)}">
                                    <span th:text="${sys.name}">系统</span>
                                </label>
                            </div>
                        </div>
                        <div id="systemHiddenInputs"></div>

                        <div class="dropdown">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle status-filter-btn"
                                    type="button" id="menuFilterBtn" data-bs-toggle="dropdown"
                                    data-bs-auto-close="outside" aria-expanded="false" style="min-width: 140px;">
                                <span id="menuFilterLabel">全部功能菜单</span>
                            </button>
                            <div class="dropdown-menu status-filter-menu p-2" aria-labelledby="menuFilterBtn"
                                 id="menuFilterMenu">
                                <div id="menuFilterEmpty" class="px-2 py-1 text-muted small"
                                     th:if="${menuOptions == null or #lists.isEmpty(menuOptions)}">请先选择系统</div>
                                <label class="status-filter-item menu-option-item" th:each="m : ${menuOptions}">
                                    <input type="checkbox" class="form-check-input menu-option" th:value="${m}"
                                           th:checked="${menuFilters != null and #lists.contains(menuFilters, m)}">
                                    <span th:text="${m}">菜单</span>
                                </label>
                            </div>
                        </div>
                        <div id="menuHiddenInputs"></div>

                        <input type="text" name="handler" class="form-control form-control-sm" style="width: 100px;"
                               placeholder="处理人" th:value="${handlerFilter}">
                        <input type="text" name="submitter" class="form-control form-control-sm" style="width: 100px;"
                               placeholder="提交人" th:value="${submitterFilter}">
                        <input type="text" name="keyword" class="form-control form-control-sm" style="width: 140px;"
                               placeholder="关键词" th:value="${keyword}">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">筛选</button>
                        <a href="/tickets" class="btn btn-link btn-sm">重置</a>
                    </form>
                    <a href="/tickets/new" class="btn btn-primary btn-sm">+ 新建工单</a>
                </div>
                <div class="panel-body">
                    <div th:if="${#lists.isEmpty(tickets)}" class="table-empty">
                        <p class="mb-2">暂无符合条件的工单</p>
                        <a href="/tickets/new" class="btn btn-outline-primary btn-sm">创建工单</a>
                    </div>
                    <table class="data-table" th:unless="${#lists.isEmpty(tickets)}">
                        <thead>
                        <tr>
                            <th>项目</th>
                            <th>工单类型</th>
                            <th>状态</th>
                            <th>工单内容</th>
                            <th>处理人</th>
                            <th>提交人</th>
                            <th>目标完成</th>
                            <th>预计完成</th>
                            <th>注意事项</th>
                            <th>提交时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${tickets}"
                            th:classappend="${item.isTargetDueToday()} ? 'row-target-today' : (${item.status != '已完成' and item.expectedCompleteDate != null and item.expectedCompleteDate.isBefore(T(java.time.LocalDate).now())} ? 'row-warning' : '')">
                            <td>
                                <a th:href="@{/tickets/{id}(id=${item.id})}" class="link-tech fw-semibold"
                                   th:text="${item.archive.projectName}">项目</a>
                            </td>
                            <td th:text="${item.orderType}">类型</td>
                            <td>
                                <span class="tag tag-default" th:if="${item.status == '已提交'}" th:text="${item.status}">状态</span>
                                <span class="tag tag-info" th:if="${item.status == '沟通中'}" th:text="${item.status}">状态</span>
                                <span class="tag tag-warning" th:if="${item.status == '处理中'}" th:text="${item.status}">状态</span>
                                <span class="tag tag-danger" th:if="${item.status == '待升级'}" th:text="${item.status}">状态</span>
                                <span class="tag tag-success" th:if="${item.status == '已完成'}" th:text="${item.status}">状态</span>
                            </td>
                            <td class="cell-clamp" th:text="${item.content ?: '—'}">—</td>
                            <td th:text="${item.handler ?: '—'}">—</td>
                            <td th:text="${item.submitter ?: '—'}">—</td>
                            <td>
                                <span th:if="${item.targetCompleteDate != null}"
                                      th:classappend="${item.isTargetDueToday()} ? 'text-danger fw-semibold' : ''"
                                      th:text="${#temporals.format(item.targetCompleteDate, 'yyyy-MM-dd')}">—</span>
                                <span th:if="${item.targetCompleteDate == null}">—</span>
                            </td>
                            <td th:text="${item.expectedCompleteDate != null ? #temporals.format(item.expectedCompleteDate, 'yyyy-MM-dd') : '—'}">—</td>
                            <td class="cell-clamp" th:text="${item.attentionNote ?: '—'}">—</td>
                            <td th:text="${#temporals.format(item.createTime, 'yyyy-MM-dd HH:mm')}">—</td>
                            <td class="cell-actions">
                                <a th:href="@{/tickets/{id}(id=${item.id})}">详情</a>
                                <a th:href="@{/tickets/{id}/edit(id=${item.id})}">编辑</a>
                                <form th:action="@{/tickets/{id}/delete(id=${item.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('确定删除该工单？')">
                                    <button type="submit" class="btn btn-link btn-sm text-danger p-0 border-0">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    const form = document.getElementById('ticketFilterForm');
    if (!form) return;

    function selectedValues(selector) {
        return Array.from(form.querySelectorAll(selector + ':checked')).map((el) => el.value);
    }

    function syncMultiFilter(optionSelector, labelEl, hiddenBox, emptyLabel, singleAsIs, countPrefix, inputName) {
        const values = selectedValues(optionSelector);
        if (values.length === 0) {
            labelEl.textContent = emptyLabel;
        } else if (values.length === 1 && singleAsIs) {
            const checked = form.querySelector(optionSelector + ':checked');
            const text = checked && checked.nextElementSibling ? checked.nextElementSibling.textContent.trim() : values[0];
            labelEl.textContent = text || values[0];
        } else {
            labelEl.textContent = countPrefix + '(' + values.length + ')';
        }
        hiddenBox.innerHTML = '';
        values.forEach((value) => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = inputName;
            input.value = value;
            hiddenBox.appendChild(input);
        });
        return values;
    }

    const statusLabel = document.getElementById('statusFilterLabel');
    const statusHidden = document.getElementById('statusHiddenInputs');
    const archiveLabel = document.getElementById('archiveFilterLabel');
    const archiveHidden = document.getElementById('archiveHiddenInputs');
    const systemLabel = document.getElementById('systemFilterLabel');
    const systemHidden = document.getElementById('systemHiddenInputs');
    const menuLabel = document.getElementById('menuFilterLabel');
    const menuHidden = document.getElementById('menuHiddenInputs');
    const menuMenu = document.getElementById('menuFilterMenu');

    function syncAll() {
        syncMultiFilter('.status-option', statusLabel, statusHidden, '全部状态', true, '状态', 'status');
        syncMultiFilter('.archive-option', archiveLabel, archiveHidden, '全部项目', true, '项目', 'archiveId');
        syncMultiFilter('.system-option', systemLabel, systemHidden, '全部系统', true, '系统', 'systemId');
        syncMultiFilter('.menu-option', menuLabel, menuHidden, '全部功能菜单', true, '菜单', 'menu');
    }

    function renderMenus(titles, keepSelected) {
        const selected = new Set(keepSelected || selectedValues('.menu-option'));
        menuMenu.innerHTML = '';
        if (!titles || titles.length === 0) {
            const empty = document.createElement('div');
            empty.id = 'menuFilterEmpty';
            empty.className = 'px-2 py-1 text-muted small';
            empty.textContent = '请先选择系统';
            menuMenu.appendChild(empty);
            syncMultiFilter('.menu-option', menuLabel, menuHidden, '全部功能菜单', true, '菜单', 'menu');
            return;
        }
        titles.forEach((title) => {
            const label = document.createElement('label');
            label.className = 'status-filter-item menu-option-item';
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.className = 'form-check-input menu-option';
            input.value = title;
            input.checked = selected.has(title);
            input.addEventListener('change', syncAll);
            const span = document.createElement('span');
            span.textContent = title;
            label.appendChild(input);
            label.appendChild(span);
            menuMenu.appendChild(label);
        });
        syncAll();
    }

    let menuLoadSeq = 0;
    async function reloadMenusFromSystems() {
        const systemIds = selectedValues('.system-option');
        const seq = ++menuLoadSeq;
        if (systemIds.length === 0) {
            renderMenus([], []);
            return;
        }
        const params = new URLSearchParams();
        systemIds.forEach((id) => params.append('projectId', id));
        try {
            const resp = await fetch('/api/analysis/menus?' + params.toString(), {
                headers: { 'Accept': 'application/json' }
            });
            if (!resp.ok) throw new Error('load failed');
            const titles = await resp.json();
            if (seq !== menuLoadSeq) return;
            renderMenus(Array.isArray(titles) ? titles : [], selectedValues('.menu-option'));
        } catch (e) {
            if (seq !== menuLoadSeq) return;
            renderMenus([], []);
        }
    }

    form.querySelectorAll('.status-option, .archive-option, .menu-option').forEach((el) => {
        el.addEventListener('change', syncAll);
    });
    form.querySelectorAll('.system-option').forEach((el) => {
        el.addEventListener('change', () => {
            syncAll();
            reloadMenusFromSystems();
        });
    });
    form.addEventListener('submit', syncAll);
    syncAll();
})();
</script>
<div th:replace="~{fragments/cell-clamp-tooltip :: cellClampTooltip}"></div>
</body>
</html>
