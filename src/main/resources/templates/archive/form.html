<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('产品交付 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1 th:text="${delivery.id != null ? '编辑产品交付' : '新建产品交付'}">产品交付</h1>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div class="form-page-card">
        <form th:action="@{/archives/save}" method="post" th:object="${delivery}">
            <input type="hidden" th:field="*{id}" th:if="${delivery.id != null and !delivery.id.isEmpty()}">
            <input type="hidden" th:field="*{createBy}" th:if="${delivery.createBy != null}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">使用单位 <span class="text-danger">*</span></label>
                    <select th:field="*{customerId}" class="form-select" id="customerSelect">
                        <option value="">请选择或下方新建</option>
                        <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}">医院</option>
                    </select>
                    <input type="text" name="newCustomerName" class="form-control form-control-sm mt-2"
                           placeholder="或输入新使用单位名称（保存时自动创建）">
                </div>
                <div class="col-md-6">
                    <label class="form-label">产品 <span class="text-danger">*</span></label>
                    <select th:field="*{productId}" class="form-select" required>
                        <option value="">请选择产品</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}">产品</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">模块/批次名称 <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{deliveryName}" class="form-control" required
                           placeholder="如：质控模块、台账模块">
                </div>
                <div class="col-md-6">
                    <label class="form-label">院内编码（可选）</label>
                    <input type="text" th:field="*{deliveryCode}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">服务商（可选）</label>
                    <select th:field="*{partnerId}" class="form-select">
                        <option value="">无</option>
                        <option th:each="p : ${partners}" th:value="${p.id}" th:text="${p.name}">服务商</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">上线时间</label>
                    <input type="date" name="launchDate" class="form-control"
                           th:value="${delivery.launchDate != null ? #temporals.format(delivery.launchDate, 'yyyy-MM-dd') : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">维保到期时间</label>
                    <input type="date" name="maintExpireDate" class="form-control"
                           th:value="${delivery.maintExpireDate != null ? #temporals.format(delivery.maintExpireDate, 'yyyy-MM-dd') : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">现场负责人</label>
                    <input type="text" th:field="*{onsiteManager}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">实施负责人</label>
                    <input type="text" th:field="*{implManager}" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">上线方案</label>
                    <textarea th:field="*{launchPlan}" class="form-control" rows="6"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">特殊流程</label>
                    <textarea th:field="*{specialProcess}" class="form-control" rows="6"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">联系方式</label>
                    <textarea th:field="*{contactInfo}" class="form-control" rows="5"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">远程方式</label>
                    <textarea th:field="*{remoteMethod}" class="form-control" rows="5"></textarea>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="/archives" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>

            <div th:replace="~{fragments/archive-attachments :: attachmentSection(delivery=${delivery}, editable=${delivery.id != null and !#strings.isEmpty(delivery.id)}, returnTo='edit')}"></div>
            </div>
        </div>
    </main>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
