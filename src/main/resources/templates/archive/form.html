<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('档案 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1 th:text="${archive.id != null ? '编辑档案' : '新建档案'}">档案</h1>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>
            <div class="form-page-card">
        <form th:action="@{/archives/save}" method="post" th:object="${archive}">
            <input type="hidden" th:field="*{id}" th:if="${archive.id != null and !archive.id.isEmpty()}">
            <input type="hidden" th:field="*{createBy}" th:if="${archive.createBy != null}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">项目名称 <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{projectName}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">项目类型</label>
                    <input type="text" th:field="*{projectType}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">上线时间</label>
                    <input type="date" name="launchDate" class="form-control"
                           th:value="${archive.launchDate != null ? #temporals.format(archive.launchDate, 'yyyy-MM-dd') : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">维保到期时间</label>
                    <input type="date" name="maintExpireDate" class="form-control"
                           th:value="${archive.maintExpireDate != null ? #temporals.format(archive.maintExpireDate, 'yyyy-MM-dd') : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">现场负责人</label>
                    <input type="text" th:field="*{onsiteManager}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">实施负责人</label>
                    <input type="text" th:field="*{implManager}" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">上线方案</label>
                    <textarea th:field="*{launchPlan}" class="form-control" rows="6"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">特殊流程</label>
                    <textarea th:field="*{specialProcess}" class="form-control" rows="6"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">联系方式</label>
                    <textarea th:field="*{contactInfo}" class="form-control" rows="5"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">远程方式</label>
                    <textarea th:field="*{remoteMethod}" class="form-control" rows="5"></textarea>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="/archives" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>

            <div th:replace="~{fragments/archive-attachments :: attachmentSection(archive=${archive}, editable=${archive.id != null and !#strings.isEmpty(archive.id)}, returnTo='edit')}"></div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
