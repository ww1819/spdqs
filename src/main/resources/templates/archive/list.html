<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/app-head :: head('档案管理 - 档案工单系统')}"></head>
<body class="app-page">
<div class="app-shell">
    <div th:replace="~{fragments/app-nav :: sidebar}"></div>
    <main class="app-main">
        <header class="app-header">
            <h1>档案列表</h1>
            <p class="header-desc">管理项目档案与维保信息</p>
        </header>
        <div class="app-content">
            <div th:replace="~{fragments/page-header :: alerts}"></div>

            <div class="panel">
                <div class="toolbar">
                    <form method="get" action="/archives" class="toolbar-filters m-0">
                        <input type="text" name="keyword" class="form-control form-control-sm" style="width: 180px;"
                               placeholder="搜索项目/负责人" th:value="${keyword}">
                        <select name="status" class="form-select form-select-sm" style="width: auto;">
                            <option value="">全部状态</option>
                            <option th:each="s : ${statuses}" th:value="${s.label}" th:text="${s.label}"
                                    th:selected="${statusFilter == s.label}"></option>
                        </select>
                        <button type="submit" class="btn btn-outline-secondary btn-sm">筛选</button>
                        <a href="/archives" class="btn btn-link btn-sm">重置</a>
                    </form>
                    <a href="/archives/new" class="btn btn-primary btn-sm">+ 新建档案</a>
                </div>
                <div class="panel-body">
                    <div th:if="${#lists.isEmpty(archives)}" class="table-empty">
                        <p class="mb-2">暂无档案数据</p>
                        <a href="/archives/new" class="btn btn-outline-primary btn-sm">创建第一条档案</a>
                    </div>
                    <table class="data-table" th:unless="${#lists.isEmpty(archives)}">
                        <thead>
                        <tr>
                            <th>项目名称</th>
                            <th>项目类型</th>
                            <th>上线时间</th>
                            <th>维保到期</th>
                            <th>状态</th>
                            <th>现场负责人</th>
                            <th>实施负责人</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${archives}">
                            <td>
                                <a th:href="@{/archives/{id}(id=${item.id})}" class="link-tech fw-semibold"
                                   th:text="${item.projectName}">项目</a>
                            </td>
                            <td th:text="${item.projectType ?: '—'}">—</td>
                            <td th:text="${item.launchDate != null ? #temporals.format(item.launchDate, 'yyyy-MM-dd') : '—'}">—</td>
                            <td th:text="${item.maintExpireDate != null ? #temporals.format(item.maintExpireDate, 'yyyy-MM-dd') : '—'}">—</td>
                            <td>
                                <span class="tag tag-info" th:if="${item.statusLabel == '上线中'}" th:text="${item.statusLabel}">状态</span>
                                <span class="tag tag-success" th:if="${item.statusLabel == '维保中'}" th:text="${item.statusLabel}">状态</span>
                                <span class="tag tag-warning" th:if="${item.statusLabel == '维保到期在三个月内'}" th:text="${item.statusLabel}">状态</span>
                                <span class="tag tag-danger" th:if="${item.statusLabel == '维保到期'}" th:text="${item.statusLabel}">状态</span>
                            </td>
                            <td th:text="${item.onsiteManager ?: '—'}">—</td>
                            <td th:text="${item.implManager ?: '—'}">—</td>
                            <td class="cell-actions">
                                <a th:href="@{/archives/{id}(id=${item.id})}">详情</a>
                                <a th:href="@{/archives/{id}/nodes(id=${item.id})}">节点</a>
                                <a th:href="@{/archives/{id}/edit(id=${item.id})}">编辑</a>
                                <form th:action="@{/archives/{id}/delete(id=${item.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('确定删除该档案？')">
                                    <button type="submit" class="btn btn-link btn-sm text-danger p-0 border-0">删除</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
